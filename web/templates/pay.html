<!DOCTYPE html>
<html>
<head>
    <title>Pay - MyWallet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 480px; margin: 40px auto; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px; }
        h1 { font-size: 24px; margin-bottom: 24px; color: #333; }
        .field { margin-bottom: 16px; padding: 12px; background: #f9f9f9; border-radius: 8px; }
        .label { font-size: 12px; color: #666; text-transform: uppercase; }
        .value { font-size: 18px; font-weight: 600; color: #333; margin-top: 4px; }
        .amount { font-size: 32px; font-weight: 700; color: #1a1a1a; }
        .buttons { display: flex; gap: 12px; margin-top: 24px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-pay { background: #4CAF50; color: white; }
        .btn-pay:hover { background: #45a049; }
        .btn-cancel { background: #f44336; color: white; }
        .btn-cancel:hover { background: #da190b; }
        .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .final-state { color: #666; font-size: 14px; margin-top: 16px; }
        .merchant { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <p class="merchant">{{.MerchantName}}</p>
        <h1>Payment Confirmation</h1>
        
        {{if .ErrorMessage}}
        <div class="error">{{.ErrorMessage}}</div>
        {{end}}
        
        <div class="field">
            <div class="label">Order ID</div>
            <div class="value">{{.OrderID}}</div>
        </div>
        
        <div class="field">
            <div class="label">Amount</div>
            <div class="value amount">{{.Currency}} {{.Amount}}</div>
        </div>
        
        {{if not .FinalState}}
        <form method="POST" action="/pay/{{.RedirectToken}}/confirm">
            <input type="hidden" name="user_id" value="{{.UserID}}">
            <div class="buttons">
                <button type="submit" class="btn-pay">Pay Now</button>
                <button type="button" class="btn-cancel" onclick="window.location.href='/pay/{{.RedirectToken}}/cancel'">Cancel</button>
            </div>
        </form>
        {{else}}
        <div class="final-state">
            This payment has already been processed (Status: {{.Status}})
        </div>
        {{end}}
    </div>
</body>
</html>
